<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Admin Panel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1c1e21; min-height: 100vh; }

.login { position: fixed; inset: 0; background: linear-gradient(135deg, #1c1e21, #2c2f33); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.lbox { background: white; padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
.llogo { font-size: 50px; margin-bottom: 15px; }
.lbox h1 { margin-bottom: 25px; font-size: 22px; }
.lbox input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; text-align: center; letter-spacing: 4px; }
.lbox input:focus { border-color: #075e54; }
.lbox button { width: 100%; padding: 14px; margin-top: 15px; background: #075e54; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
.err { color: #e74c3c; font-size: 14px; margin-top: 12px; min-height: 20px; }

.panel { display: none; }
.panel.on { display: block; }
.hdr { background: #075e54; color: white; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.hdr h1 { font-size: 20px; }
.out { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.tabs { display: flex; background: white; padding: 0 24px; border-bottom: 1px solid #e0e0e0; gap: 5px; overflow-x: auto; }
.tab { padding: 15px 20px; background: none; border: none; font-size: 15px; color: #65676b; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; }
.tab.on { color: #075e54; border-bottom-color: #075e54; }
.cont { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
.cont.on { display: block; }
.card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.card h2 { font-size: 17px; margin-bottom: 18px; }
.card-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
.card-hdr h2 { margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row input { flex: 1; min-width: 140px; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; outline: none; }
.row input:focus { border-color: #075e54; }
.row button { padding: 12px 24px; background: #25d366; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.row button:hover { background: #1ebe5d; }
.danger { padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 700; }
.danger:hover { background: #c0392b; }

.ulist, .mlist { display: flex; flex-direction: column; gap: 10px; }
.uitem { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #f7f8fa; border-radius: 10px; gap: 12px; flex-wrap: wrap; }
.uinfo { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 12px; }
.uav { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #25d366, #1ebe5d); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.udet { flex: 1; }
.uname { font-weight: 700; margin-bottom: 2px; }
.ucode { font-family: 'Courier New', monospace; font-size: 13px; background: #e7f3ef; padding: 2px 8px; border-radius: 6px; display: inline-block; color: #075e54; font-weight: 700; margin-right: 6px; }
.ustatus { font-size: 12px; color: #667781; }
.umeta { font-size: 11px; color: #999; margin-top: 4px; }
.uacts { display: flex; gap: 8px; }
.ib { width: 36px; height: 36px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.edit { background: #e7f3ef; }
.del { background: #fde8e8; }
.admin-badge { background: #ffd700; color: #333; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 6px; }

.mitem { display: flex; justify-content: space-between; padding: 12px 14px; background: #f7f8fa; border-radius: 10px; gap: 12px; align-items: flex-start; }
.mcontent { flex: 1; }
.msender { font-weight: 700; color: #075e54; font-size: 13px; margin-bottom: 3px; }
.mtext { font-size: 14px; word-break: break-word; }
.mdate { font-size: 11px; color: #999; margin-top: 4px; }
.mdel { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 16px; padding: 5px; }

.newuser { margin-top: 15px; padding: 15px; background: #e7f3ef; border-radius: 10px; border-left: 4px solid #25d366; }
.newuser .l { font-size: 12px; color: #666; margin-bottom: 5px; }
.newuser .v { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 700; color: #075e54; letter-spacing: 1px; }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal.on { display: flex; }
.mbox { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
.mbox h3 { margin-bottom: 18px; color: #075e54; }
.mbox label { display: block; font-size: 13px; color: #666; margin: 12px 0 6px; font-weight: 600; }
.mbox input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; outline: none; }
.mbox input:focus { border-color: #075e54; }
.macts { display: flex; gap: 10px; margin-top: 20px; }
.macts button { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
.mcancel { background: #f0f2f5; color: #333; }
.msave { background: #25d366; color: white; }

@media (max-width: 600px) {
  .row { flex-direction: column; }
  .row button { width: 100%; }
  .uitem { flex-direction: column; align-items: stretch; }
  .uacts { justify-content: flex-end; }
  .cont { padding: 16px; }
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="lbox">
    <div class="llogo">🔐</div>
    <h1>Admin Panel</h1>
    <input type="password" id="pw" placeholder="••••">
    <button id="gir">Giriş Yap</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="panel" id="panel">
  <header class="hdr">
    <h1>🔐 Admin Panel</h1>
    <button class="out" id="cikis">Çıkış</button>
  </header>
  <nav class="tabs">
    <button class="tab on" data-t="users">👥 Kullanıcılar</button>
    <button class="tab" data-t="msgs">💬 Mesajlar</button>
    <button class="tab" data-t="set">⚙️ Ayarlar</button>
  </nav>

  <section class="cont on" id="c-users">
    <div class="card">
      <h2>Yeni Kullanıcı Oluştur</h2>
      <div class="row">
        <input type="text" id="nuName" placeholder="İsim (örn: Aşkım)">
        <input type="tel" id="nuCode" placeholder="Şifre (4-8 hane)" maxlength="8">
        <input type="text" id="nuAvatar" placeholder="Emoji (💕)" maxlength="4" style="max-width:100px;">
        <button id="createUser">Oluştur</button>
      </div>
      <div id="newUserResult"></div>
    </div>
    <div class="card">
      <h2>Kullanıcılar</h2>
      <div class="ulist" id="ulist"></div>
    </div>
  </section>

  <section class="cont" id="c-msgs">
    <div class="card">
      <div class="card-hdr">
        <h2>Mesajlar</h2>
        <button class="danger" id="clearAll">Tümünü Sil</button>
      </div>
      <div class="mlist" id="mlist"></div>
    </div>
  </section>

  <section class="cont" id="c-set">
    <div class="card">
      <h2>Admin Şifresini Değiştir</h2>
      <div class="row">
        <input type="password" id="newPw" placeholder="Yeni şifre (min 4)">
        <button id="changePw">Değiştir</button>
      </div>
      <div id="pwResult" style="margin-top:12px;"></div>
    </div>
  </section>
</div>

<div class="modal" id="editModal">
  <div class="mbox">
    <h3>Kullanıcıyı Düzenle</h3>
    <label>İsim</label>
    <input type="text" id="euName">
    <label>Şifre</label>
    <input type="tel" id="euCode" maxlength="8">
    <label>Emoji Avatar</label>
    <input type="text" id="euAvatar" maxlength="4">
    <div class="macts">
      <button class="mcancel" id="editCancel">İptal</button>
      <button class="msave" id="editSave">Kaydet</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
