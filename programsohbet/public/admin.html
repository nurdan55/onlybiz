<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1c1e21; min-height: 100vh; }

.login { position: fixed; inset: 0; background: linear-gradient(135deg, #1c1e21, #2c2f33); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.login-box { background: white; padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
.logo { font-size: 50px; margin-bottom: 15px; }
.login-box h1 { margin-bottom: 25px; font-size: 22px; }
.login-box input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; }
.login-box input:focus { border-color: #075e54; }
.login-box button { width: 100%; padding: 14px; margin-top: 15px; background: #075e54; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
.err { color: #e74c3c; font-size: 14px; margin-top: 12px; min-height: 20px; }

.panel { display: none; }
.panel.on { display: block; }
.hdr { background: #075e54; color: white; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; }
.hdr h1 { font-size: 20px; }
.out { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; }
.tabs { display: flex; background: white; padding: 0 24px; border-bottom: 1px solid #e0e0e0; gap: 5px; }
.tab { padding: 15px 20px; background: none; border: none; font-size: 15px; color: #65676b; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 500; }
.tab.on { color: #075e54; border-bottom-color: #075e54; }
.cont { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
.cont.on { display: block; }
.card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.card h2 { font-size: 17px; margin-bottom: 18px; }
.row { display: flex; gap: 10px; }
.row input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; outline: none; }
.row input:focus { border-color: #075e54; }
.row button { padding: 12px 24px; background: #25d366; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.danger { padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 700; }

.klist { display: flex; flex-direction: column; gap: 10px; }
.kitem { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #f7f8fa; border-radius: 10px; gap: 12px; flex-wrap: wrap; }
.kinfo { flex: 1; min-width: 200px; }
.kname { font-weight: 700; margin-bottom: 4px; }
.kval { font-family: 'Courier New', monospace; font-size: 14px; background: #e7f3ef; padding: 3px 8px; border-radius: 6px; display: inline-block; color: #075e54; font-weight: 700; }
.kmeta { font-size: 11px; color: #999; margin-top: 6px; }
.kacts { display: flex; gap: 8px; }
.ib { width: 36px; height: 36px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
.cp { background: #e7f3ef; }
.tg { background: #fff3cd; }
.dl { background: #fde8e8; }
.kitem.pasif { opacity: 0.5; }

.mlist { display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; }
.mitem { display: flex; justify-content: space-between; padding: 12px 14px; background: #f7f8fa; border-radius: 10px; gap: 12px; }
.msender { font-weight: 700; color: #075e54; font-size: 13px; margin-bottom: 3px; }
.mtext { font-size: 14px; word-break: break-word; }
.mdate { font-size: 11px; color: #999; margin-top: 4px; }
.mdel { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 16px; }

.newkey { margin-top: 15px; padding: 15px; background: #e7f3ef; border-radius: 10px; border-left: 4px solid #25d366; }
.newkey .l { font-size: 12px; color: #666; margin-bottom: 5px; }
.newkey .v { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 700; color: #075e54; letter-spacing: 1px; word-break: break-all; }

@media (max-width: 600px) {
  .row { flex-direction: column; }
  .row button { width: 100%; }
  .kitem { flex-direction: column; align-items: stretch; }
  .cont { padding: 16px; }
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <div class="logo">🔐</div>
    <h1>Admin Panel</h1>
    <input type="password" id="pw" placeholder="Şifre">
    <button id="gir">Giriş</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="panel" id="panel">
  <div class="hdr">
    <h1>🔐 Admin Panel</h1>
    <button class="out" id="cikis">Çıkış</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="keys">🔑 Keyler</button>
    <button class="tab" data-t="msgs">💬 Mesajlar</button>
    <button class="tab" data-t="set">⚙️ Ayarlar</button>
  </div>

  <div class="cont on" id="c-keys">
    <div class="card">
      <h2>Yeni Key Oluştur</h2>
      <div class="row">
        <input type="text" id="yeniAd" placeholder="İsim (örn: Aşkım)">
        <button id="olustur">Oluştur</button>
      </div>
      <div id="sonuc"></div>
    </div>
    <div class="card">
      <h2>Mevcut Keyler</h2>
      <div class="klist" id="klist"></div>
    </div>
  </div>

  <div class="cont" id="c-msgs">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <h2 style="margin:0;">Mesajlar</h2>
        <button class="danger" id="temizle">Tümünü Sil</button>
      </div>
      <div class="mlist" id="mlist"></div>
    </div>
  </div>

  <div class="cont" id="c-set">
    <div class="card">
      <h2>Admin Şifresini Değiştir</h2>
      <div class="row">
        <input type="password" id="yeniPw" placeholder="Yeni şifre (min 4)">
        <button id="pwDegis">Değiştir</button>
      </div>
      <div id="pwSonuc" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('admin_t') || '';
const $ = id => document.getElementById(id);

$('gir').onclick = async () => {
  const pw = $('pw').value;
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (r.ok) {
    const d = await r.json();
    token = d.token;
    localStorage.setItem('admin_t', token);
    ac();
  } else {
    $('err').textContent = 'Yanlış şifre!';
  }
};
$('pw').addEventListener('keypress', e => { if (e.key === 'Enter') $('gir').click(); });

if (token) ac();

function ac() {
  $('login').style.display = 'none';
  $('panel').classList.add('on');
  keysYukle();
  msgsYukle();
}

$('cikis').onclick = () => {
  localStorage.removeItem('admin_t');
  location.reload();
};

async function api(url, opt = {}) {
  const r = await fetch(url, {
    ...opt,
    headers: { 'Content-Type': 'application/json', 'X-Token': token, ...(opt.headers || {}) }
  });
  if (r.status === 401) { localStorage.removeItem('admin_t'); location.reload(); }
  return r.json();
}

// Tabs
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.cont').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    $('c-' + t.dataset.t).classList.add('on');
  };
});

// Keyler
async function keysYukle() {
  const keys = await api('/api/keys');
  const list = $('klist');
  if (!keys.length) { list.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Henüz key yok</p>'; return; }
  list.innerHTML = keys.map(k => `
    <div class="kitem ${k.is_active ? '' : 'pasif'}">
      <div class="kinfo">
        <div class="kname">${esc(k.name)}</div>
        <div class="kval">${k.key_value}</div>
        <div class="kmeta">${tarih(k.created_at)} • ${k.is_active ? '🟢 Aktif' : '🔴 Pasif'}</div>
      </div>
      <div class="kacts">
        <button class="ib cp" onclick="kopya('${k.key_value}')" title="Kopyala">📋</button>
        <button class="ib tg" onclick="toggle(${k.id}, ${k.is_active})" title="Aktif/Pasif">${k.is_active ? '⏸' : '▶'}</button>
        <button class="ib dl" onclick="sil(${k.id})" title="Sil">🗑</button>
      </div>
    </div>
  `).join('');
}

$('olustur').onclick = async () => {
  const name = $('yeniAd').value.trim();
  if (!name) return alert('İsim gerekli');
  const r = await api('/api/keys', { method: 'POST', body: JSON.stringify({ name }) });
  if (r.success) {
    $('sonuc').innerHTML = `<div class="newkey"><div class="l">Yeni key (${esc(name)}):</div><div class="v">${r.key}</div></div>`;
    $('yeniAd').value = '';
    keysYukle();
  } else alert(r.error);
};

window.kopya = k => { navigator.clipboard.writeText(k); alert('Kopyalandı: ' + k); };
window.sil = async id => { if (!confirm('Silinsin mi?')) return; await api('/api/keys/' + id, { method: 'DELETE' }); keysYukle(); };
window.toggle = async (id, a) => { await api('/api/keys/' + id, { method: 'PATCH', body: JSON.stringify({ is_active: !a }) }); keysYukle(); };

// Mesajlar
async function msgsYukle() {
  const msgs = await api('/api/messages');
  const list = $('mlist');
  if (!msgs.length) { list.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Mesaj yok</p>'; return; }
  list.innerHTML = msgs.map(m => `
    <div class="mitem">
      <div style="flex:1;">
        <div class="msender">${esc(m.sender)}</div>
        <div class="mtext">${esc(m.message)}</div>
        <div class="mdate">${tarih(m.created_at)}</div>
      </div>
      <button class="mdel" onclick="msil(${m.id})">🗑</button>
    </div>
  `).join('');
}

window.msil = async id => { if (!confirm('Silinsin mi?')) return; await api('/api/messages/' + id, { method: 'DELETE' }); msgsYukle(); };
$('temizle').onclick = async () => { if (!confirm('TÜM mesajlar silinsin mi?')) return; await api('/api/messages', { method: 'DELETE' }); msgsYukle(); };

// Şifre
$('pwDegis').onclick = async () => {
  const np = $('yeniPw').value;
  if (np.length < 4) { $('pwSonuc').textContent = 'En az 4 karakter!'; return; }
  const r = await api('/api/password', { method: 'POST', body: JSON.stringify({ newPass: np }) });
  if (r.success) {
    token = r.newToken;
    localStorage.setItem('admin_t', token);
    $('pwSonuc').innerHTML = '<span style="color:#25d366;">✓ Şifre değişti</span>';
    $('yeniPw').value = '';
  }
};

function tarih(s) {
  if (!s) return '-';
  return new Date(s + 'Z').toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
</script>
</body>
</html>
