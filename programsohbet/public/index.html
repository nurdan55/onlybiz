<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>💕 Bizim Sohbetimiz</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">💕</div>
    <h1>Bizim Sohbetimiz</h1>
    <p class="login-sub">Sadece ikimize özel</p>
    
    <div class="input-group">
      <input type="tel" id="loginCode" placeholder="Şifreni gir" maxlength="8" autocomplete="off" inputmode="numeric">
    </div>
    <button class="btn-primary" id="loginBtn">Giriş Yap 💌</button>
    <div class="login-error" id="loginError"></div>
    
    <div class="login-footer">
      <a href="/admin.html" class="admin-link">🔐 Admin Girişi</a>
    </div>
  </div>
</div>

<!-- SOHBET EKRANI -->
<div class="chat-screen" id="chatScreen">
  
  <!-- Header -->
  <header class="chat-header">
    <div class="header-left">
      <div class="header-avatar" id="myAvatar">💙</div>
      <div class="header-info">
        <div class="header-title" id="chatTitle">Bizim Sohbetimiz</div>
        <div class="header-status" id="onlineStatus">Bağlanıyor...</div>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="searchBtn" title="Ara">🔍</button>
      <button class="icon-btn" id="menuBtn" title="Menü">⋮</button>
    </div>
  </header>

  <!-- Arama çubuğu -->
  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Mesajlarda ara...">
    <button id="closeSearch">✕</button>
  </div>

  <!-- Mesajlar -->
  <div class="messages" id="messages"></div>

  <!-- Yazıyor göstergesi -->
  <div class="typing" id="typing"></div>

  <!-- Emoji paneli -->
  <div class="emoji-panel" id="emojiPanel">
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <!-- Mesaj formu -->
  <form class="message-form" id="messageForm">
    <button type="button" class="icon-btn emoji-btn" id="emojiBtn">😊</button>
    <input type="text" id="messageInput" placeholder="Mesaj yaz..." autocomplete="off">
    <button type="button" class="icon-btn mic-btn" id="micBtn" title="Ses kaydet">🎤</button>
    <button type="submit" class="send-btn" id="sendBtn" title="Gönder">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </form>
</div>

<!-- Kayıt göstergesi -->
<div class="recording-overlay" id="recordingOverlay">
  <div class="recording-box">
    <div class="recording-dot"></div>
    <div class="recording-time" id="recordingTime">0:00</div>
    <div class="recording-hint">Kaydı durdurmak için mikrofona bas</div>
  </div>
</div>

<!-- Menü -->
<div class="menu-overlay" id="menuOverlay">
  <div class="menu-card">
    <div class="menu-profile" id="menuProfile">
      <div class="menu-avatar" id="menuAvatar">💙</div>
      <div class="menu-name" id="menuName">Ben</div>
      <div class="menu-status" id="menuStatus">Hayat güzel</div>
    </div>
    <button class="menu-item" id="editProfileBtn">✏️ Profilimi Düzenle</button>
    <button class="menu-item" id="settingsBtn">⚙️ Ayarlar</button>
    <button class="menu-item danger" id="logoutBtn">🚪 Çıkış Yap</button>
    <button class="menu-close" id="menuClose">Kapat</button>
  </div>
</div>

<!-- Profil düzenleme -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <h3>Profilimi Düzenle</h3>
    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreview">💙</div>
      <div class="avatar-options" id="avatarOptions"></div>
    </div>
    <label>Adın</label>
    <input type="text" id="profileName" maxlength="20">
    <label>Durum</label>
    <input type="text" id="profileStatus" maxlength="40" placeholder="Hayat güzel">
    <div class="modal-actions">
      <button class="btn-secondary" id="profileCancel">İptal</button>
      <button class="btn-primary" id="profileSave">Kaydet</button>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <h3>Ayarlar</h3>
    <div class="setting-item">
      <label>
        <input type="checkbox" id="soundToggle" checked>
        <span>Bildirim sesi</span>
      </label>
    </div>
    <div class="setting-item">
      <label>
        <input type="checkbox" id="notifToggle" checked>
        <span>Tarayıcı bildirimi</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="settingsClose">Tamam</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
